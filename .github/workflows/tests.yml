name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.db.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db:
          - { name: 'MySQL 8.0', image: 'mysql:8.0', connection: 'mysql' }
          # Producción (cPanel) usa MariaDB 11.4.
          - { name: 'MariaDB 11.4', image: 'mariadb:11.4', connection: 'mariadb' }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: profitlife_testing
          MYSQL_USER: profitlife
          MYSQL_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -psecret || mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: profitlife
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, mbstring, bcmath
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código
        run: vendor/bin/pint --test

      - name: Pruebas
        run: vendor/bin/pest
